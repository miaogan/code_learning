# docker-compose.yml · SkillCoach r98 四容器交付
#   postgres = PostgreSQL 16（在线权威主库）
#   redis    = Redis 8（限流窗口 / 会话缓存 / 读缓存 / 分布式锁的共享层）
#   frontend = nginx:alpine 静态托管 + 同源反代（浏览器唯一入口）
#   backend  = FastAPI 非 root（不发布宿主端口，只在 compose 内网暴露 8000）
#
# 契约单源：docs/teamflow/memory.md「容器化交付约定」——服务名 backend/frontend/postgres/redis、
# 后端端口 8000、命名卷 skillcoach-pgdata（PG 数据）与 skillcoach-sqlite（完整离线副本）、
# 宿主端口 ${WEB_PORT:-127.0.0.1:8080}。
# 改任一项必须三处同改：本文件 + 本夹 DEPLOY.md + README.md。
#
# 硬禁令：本文件不得出现任何 Key；environment 里不得出现 AI_PROVIDER
#（compose 的 ${VAR} 只读宿主 shell 与仓库根 .env，写进去会把 backend/.env 的显式选择冲成空值）。
#
# r98 起数据库口令走宿主 shell / 仓库根 .env（`POSTGRES_PASSWORD`），仓库里只有默认值占位。
# 生产部署必须覆盖它，否则 `production_blockers` 之外的「示例口令」告警会一直亮着。

services:
  postgres:
    # r100 起换 pgvector 官方镜像（同 PostgreSQL 16 基线）：RAG 向量检索的
    # `vector` 扩展与 ivfflat 余弦索引在库内完成 top-K，不装扩展时应用层会
    # 自动降级为「取回后 Python 余弦」（见 backend/app/core/db.py 的降级口径）。
    # 官方 postgres:16-alpine 没有 pgvector，除非回滚 r100，否则不要换回去。
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sc_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # 校验和默认开启；这里显式写出来是给「从 SQLite 迁过来」的运维看的：
      # PG 会在启动时校验页面完整性，坏页直接拒绝启动而不是带着损坏继续跑。
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # 卷名**必须**与 r97 的 SQLite 卷分开：那个卷里躺着 `app.db`，
      # PG 的 initdb 只接受空目录，复用同名卷会直接 `directory exists but is not empty` 起不来。
      - skillcoach-pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` 只看「能否接受连接」，比 `SELECT 1` 轻，且 PG 镜像自带。
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sc_app}']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    # 不对宿主发布 5432：数据库只在 compose 内网可达（公网入口只有 nginx）。
    # 需要本机 psql 排障时用 `docker compose exec postgres psql -U postgres`。

  redis:
    # 钉 8.x（实测 8.10.3）。我们用到的命令 —— ZSET 滑窗、Lua 脚本、SET NX EX、EXPIRE、SCAN ——
    # 在 7 与 8 语义一致，升 8 不影响任何行为；选 8 是因为它是当前主线，7 已进入维护期。
    # 换大版本前先看 `redis-cli INFO server`，别让「本地跑 7、线上跑 8」这种偏差悄悄存在。
    image: redis:8-alpine
    restart: unless-stopped
    # `--save ''` 关闭 RDB 落盘：Redis 里只有限流窗口、会话缓存、读缓存这类**可重建**状态，
    # 丢了大不了重新计数/回源，落盘反而引入「快照期间 fork 抖动」和一份需要单独备份的文件。
    # `--maxmemory` 必须同时给上限：只写 allkeys-lru 而不设上限时淘汰策略**永不触发**，
    # 公网长期运行下缓存可无限涨。2C4G 单机默认 128mb，按机器规格用 REDIS_MAXMEMORY 覆盖。
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'allkeys-lru', '--maxmemory', '${REDIS_MAXMEMORY:-128mb}']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 只为「国内拉 pypi 太慢」留的口子，默认官方源；写进仓库根 .env 或宿主 shell 即可覆盖。
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    # 配置唯一来源仍是 backend/.env —— 这里只「引用」，不复制内容（Key 永不进 compose）。
    # required:false：新克隆还没有 .env 时 config/build/up 不炸，/health 如实报未就绪，而不是构造期炸进程。
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # 连接串用服务名而非 127.0.0.1：容器内回环不是 PG。
      # 口令与 postgres 服务同源（同一个 ${POSTGRES_PASSWORD}），改一处即可。
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sc_app}
      - REDIS_URL=redis://redis:6379/0
      - SQLITE_PATH=/data/app-fallback.db
    volumes:
      # 含业务完整副本和未回放的离线日志，容器重建必须保留；仅限单 worker。
      - skillcoach-sqlite:/data
    depends_on:
      postgres:
        # 不让 PG 故障阻塞 Web 进程：后台恢复任务会自动建连 / 补 DDL / 灌种子，
        # /health 的 db_status 如实报 starting/degraded/up（200 始终表示进程在线）。
        condition: service_started
      redis:
        # Redis 故障透明降级为进程内限流、缓存回源；状态见 /health 的 redis_status。
        condition: service_started
    healthcheck:
      # 探针命令与 backend/Dockerfile 的 HEALTHCHECK 逐字相同（compose 会整体覆盖镜像定义），
      # 只调 interval / start_period / retries。slim 无 curl，故用标准库 urllib。
      test:
        [
          "CMD",
          "python",
          "-c",
          'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=3).status==200 else 1)',
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # 「默认走 DeepSeek」的唯一落点（不改 config.py 语义，不进业务代码）：
    #   显式 AI_PROVIDER 非空 → 尊重用户选择（deepseek / lmstudio）
    #   否则 AI_DEEPSEEK_API_KEY 非空 → export AI_PROVIDER=deepseek
    #   否则保持空 = legacy 三件套（AI_BASE_URL / AI_API_KEY / AI_MODEL）
    # $$ 转义 = 交给容器内的 sh 展开（compose 只对 $VAR 做插值）。
    command:
      - sh
      - -c
      - |
        if [ -z "$$AI_PROVIDER" ] && [ -n "$$AI_DEEPSEEK_API_KEY" ]; then
          export AI_PROVIDER=deepseek
        fi
        # SQLite 副本与进程内缓存依赖同一进程的锁和协调器，禁止增加 --workers / 副本数。
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  # r104 本地 embedding 服务（可选档，默认**不启动**：必须显式 --profile embed）。
  # 形态：HF text-embeddings-inference（Rust + CPU 推理），OpenAI 兼容 /v1/embeddings，
  # 后端只要把 AI_EMBED_BASE_URL 指向 http://embedder:8080/v1 即可，检索代码零改动。
  #
  # 资源硬限额（2 vCPU / 3.6GB 的机器上刻意保守）：
  #   cpus 1.0        → 最多吃 1 核，留 1 核给 backend / PG；
  #   mem_limit 1g    → 超限由 cgroup OOM 只杀自己，不拖垮宿主；
  #   memswap_limit   → 只允许 512MB 额外 swap，避免大量换页把整机 IO 拖死；
  #   pids_limit 256  → 防 fork 风暴。
  # 不发布宿主端口：只有 compose 内网可达，公网零暴露面。
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    profiles: ["embed"]
    restart: unless-stopped
    command:
      - '--model-id'
      - '${EMBED_MODEL_ID:-BAAI/bge-small-zh-v1.5}'
      - '--port'
      - '8080'
      - '--auto-truncate'
      - '--max-client-batch-size'
      - '64'
    environment:
      # 模型缓存落在命名卷里：容器重建不重新下载（bge-small 约 100MB）。
      - HF_HOME=/data
    volumes:
      - skillcoach-embedcache:/data
    cpus: '1.0'
    mem_limit: 1g
    memswap_limit: 1536m
    pids_limit: 256

  # r118 本地 rerank 精排服务（可选档，默认**不启动**：必须显式 --profile rerank）。
  # 形态：与 embedder 同一个 TEI 镜像，换挂 reranker 模型即多出 POST /rerank 端点
  # （query + docs → 按 query-doc 相关性重排分数）。检索管线（r100）在 RRF 融合后
  # 调用它做精排；后端把 AI_RERANK_BASE_URL 指向 http://reranker:8080 即可。
  #
  # 选型 BAAI/bge-reranker-base（278M 参数，交叉编码器）：bge-small-zh-v1.5 的
  # 配套精排器，中文效果与体积的平衡点；large（560M）在 2 vCPU / 3.6GB 上太重。
  # 资源账（2026-11-17 实测）：宿主已用 1.1G / 可用 2.5G，本容器实测常驻 ~1.3G，
  # 加完仍留 ~1.2G 余量 + 1.9G swap 兜底。
  #   cpus 1.0 / mem_limit 1536m / memswap_limit 2g / pids_limit 256：
  #   口径与 embedder 一致，但内存限额放宽——reranker 权重 fp32 ~1.1G，
  #   1g 限额会被 cgroup OOM 误杀。
  # 不发布宿主端口：只有 compose 内网可达，公网零暴露面。
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    profiles: ["rerank"]
    restart: unless-stopped
    command:
      - '--model-id'
      - '${RERANK_MODEL_ID:-BAAI/bge-reranker-base}'
      - '--port'
      - '8080'
      - '--auto-truncate'
      - '--max-client-batch-size'
      - '32'
    environment:
      # 模型缓存落在命名卷里：容器重建不重新下载（bge-reranker-base ~1.1GB）。
      - HF_HOME=/data
    volumes:
      - skillcoach-rerankcache:/data
    cpus: '1.0'
    mem_limit: 1536m
    memswap_limit: 2g
    pids_limit: 256

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      # 默认只绑回环：不带任何配置直接 `up -d` 也不会把明文 8080 暴露到局域网/公网。
      # 换端口请写全 `127.0.0.1:8099`；只写 `8099` 会退化为 `0.0.0.0:8099`。
      # 公网部署由 deploy.env 提供同格式的值，叠加 prod 层后对外只剩 80/443。
      - '${WEB_PORT:-127.0.0.1:8080}:80'
    # r23：nginx 层 Basic Auth 已撤掉（鉴权改由应用登录态承担），故不再挂载 frontend/.htpasswd。
    # 如需回滚到 r21 的公网 Basic Auth，恢复 nginx.conf 的 auth_basic 两行，并加回：
    #   volumes: [./frontend/.htpasswd:/etc/nginx/.htpasswd:ro]
    depends_on:
      backend:
        # 后端进程启动即探活（PG/Redis 可随后恢复），前端不因依赖故障被卡在未创建状态。
        # 后端容器自身 stop 时 nginx 已启动，故障期间自然返回 502，不由编排反复重启。
        condition: service_started

volumes:
  # r104 embedding 模型缓存（HF_HOME）：容器重建复用，不重复下载。
  skillcoach-embedcache:
  # r118 reranker 模型缓存（HF_HOME）：容器重建复用，不重复下载（~1.1GB）。
  skillcoach-rerankcache:
  # PostgreSQL 的数据目录。docker compose down 保留数据，down -v 才删除
  # （备份/恢复见 DEPLOY.md：pg_dump -Fc，不要直接拷数据目录）。
  skillcoach-pgdata:
  # 当前版本的 SQLite 完整副本与离线操作日志；使用独立新卷，不与 r97 旧 app.db 混用。
  # 与 PG 一起备份，离线期间严禁删除或重置；恢复 PG 前删除它会造成未回同步数据丢失。
  skillcoach-sqlite:
  # r97 及更早的 SQLite 数据卷（`app.db`）。当前容器不挂载它，留着有两个用处：
  #   1. 升级时从这里把 app.db 取出来跑迁移脚本；
  #   2. 回滚到 r97 时原地可用。
  # **不要 `docker volume rm`**：删了旧数据就再也迁不回来了。
  skillcoach-data:
