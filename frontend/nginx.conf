# 生产静态托管 + 同源反向代理（浏览器到后端的唯一入口）。
# 依据：src/api/client.ts 的 BASE = (VITE_API_BASE ?? '')，生产必须同源反代 /api 与 /health；
# 既不能跨域（CORS 默认只放行 5173），也不能把后端地址烤进构建参数。
# 开发期对应物是 vite.config.ts 的 proxy（:5173 -> 127.0.0.1:8000），两份代理路由表须同改。

server {
    listen 80;
    server_name _;
    server_tokens off;

    # r23：撤掉 server 层 Basic Auth —— 鉴权改由应用自己的登录态（HttpOnly Cookie）承担。
    # 回滚到 r21 需同时恢复本处两行 auth_basic 与 compose 的 .htpasswd 只读挂载（现已移除）。

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限必须严格大于应用侧上限（Settings.max_upload_mb = 10m）：
    # 否则 10-20m 区间的请求会被 nginx 以 HTML 413 拦下，
    # 破坏后端 {error:{code,message,retryable}} 的 JSON envelope。
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json text/css application/javascript text/plain image/svg+xml;

    # SPA fallback：react-router 的客户端路由（如 /interview、/report）必须回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：长缓存 + immutable。
    # 与 nginx.prod.conf 保持一致：不用 `expires 1y`（会与 add_header 产出两个 Cache-Control 头）。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 有声书音频资产（r151）：离线预生成后放进挂载卷（compose: ./audio -> /usr/share/nginx/html/audio）。
    # 素材上线 = 往服务器 audio/ 目录放文件，前端零发版；未部署时这里 404，
    # 播放器按「素材缺失」态消费 404——**绝不回落 index.html**（那会把 JSON 当 HTML 吐出去）。
    # Range 请求由 nginx 静态模块原生支持（进度条拖动依赖它）；缓存 1 天，换素材按文件名换版。
    # index.json 是「听听」入口真源，随每次上传变化——只缓存 60s，新章入口才能及时点亮。
    location = /audio/index.json {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60";
    }

    location /audio/ {
        # 显式 MIME 映射：官方 mime.types 不含 .wav，缺了会退回 application/octet-stream，
        # 叠加 X-Content-Type-Options: nosniff 后浏览器直接拒绝解码（实测：音频 200 但播放失败）。
        types {
            audio/wav wav;
            audio/mp4 m4a;
            application/json json;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # 入口 HTML 每次回源校验，否则发布新版本后客户端仍吃旧壳。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后端 API。proxy_pass 不带尾斜杠是刻意的：后端路由前缀就是 /api/...，
    # 改写会 404（无 URI 部分 => 原样透传请求 URI）。
    # 超时 1300s = r9 的 lmstudio 档 ai_lmstudio_timeout_s=600s × (1 + ai_max_retries 1) 的余量；
    # nginx 默认 proxy_read_timeout 60s 会把本地模型链路一律打成 504。
    # r102 SSE：任务进度流与面试回合流。代理默认会攒包，事件会被成批延迟——
    # 这里显式关缓冲（后端也发了 X-Accel-Buffering: no，双保险），读超时与长任务同档。
    location ~ ^/api/(jobs|interviews)/.*/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 反代层禁缓存：报告结果与上传响应不能被冻住。
        add_header Cache-Control "no-store";
    }

    # 健康检查：与 /api/ 相同的代理参数；就绪状态绝不能被缓存。
    location = /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store";
    }
}
