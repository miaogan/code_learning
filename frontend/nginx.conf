# 生产静态托管 + 同源反向代理（浏览器到后端的唯一入口）。
# 依据：src/api/client.ts 的 BASE = (VITE_API_BASE ?? '')，生产必须同源反代 /api 与 /health；
# 既不能跨域（CORS 默认只放行 5173），也不能把后端地址烤进构建参数。
# 开发期对应物是 vite.config.ts 的 proxy（:5173 -> 127.0.0.1:8000），两份代理路由表须同改。

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 公网鉴权闸门（r21）：内网穿透把宿主端口暴露到公网后，没有这一层，
    # 任何拿到 URL 的人都能读简历/看报告，并用 backend/.env 里的真实 Key 刷额度。
    # 放在 server 层 ⇒ 页面与 /api、/health 一并生效；同源请求浏览器自动携带凭据，
    # 前端零改动（不产生 401 → JSON envelope 的解析问题）。
    # 密码文件不入库、不进镜像：本地 scripts/gen-htpasswd.sh 生成，compose 挂载
    # frontend/.htpasswd → /etc/nginx/.htpasswd:ro。仅本机 vite 开发（:5173）不经过此 server。
    auth_basic           "Skill Coach";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限必须严格大于应用侧上限（Settings.max_upload_mb = 10m）：
    # 否则 10-20m 区间的请求会被 nginx 以 HTML 413 拦下，
    # 破坏后端 {error:{code,message,retryable}} 的 JSON envelope。
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json text/css application/javascript text/plain image/svg+xml;

    # SPA fallback：react-router 的客户端路由（如 /interview、/report）必须回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：长缓存 + immutable。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 每次回源校验，否则发布新版本后客户端仍吃旧壳。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后端 API。proxy_pass 不带尾斜杠是刻意的：后端路由前缀就是 /api/...，
    # 改写会 404（无 URI 部分 => 原样透传请求 URI）。
    # 超时 1300s = r9 的 lmstudio 档 ai_lmstudio_timeout_s=600s × (1 + ai_max_retries 1) 的余量；
    # nginx 默认 proxy_read_timeout 60s 会把本地模型链路一律打成 504。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 反代层禁缓存：报告结果与上传响应不能被冻住。
        add_header Cache-Control "no-store";
    }

    # 健康检查：与 /api/ 相同的代理参数；就绪状态绝不能被缓存。
    location = /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store";
    }
}
