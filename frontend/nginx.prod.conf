# 公网部署的 TLS 版反代配置（r97）：由 docker-compose.prod.yml 挂载覆盖 nginx.conf。
#
# 与开发/内网版（nginx.conf）的差异只有「入口这一层」：
#   1. 80 只做两件事：ACME http-01 验证 + 301 跳 https；
#   2. 443 终结 TLS（证书由 certbot 签发，挂载在 /etc/nginx/certs）；
#   3. 全站安全响应头（HSTS / nosniff / Referrer / Frame / Permissions / CSP）。
# 路由表（/、/assets/、/api/、/health）与 proxy 参数与 nginx.conf **逐字一致**——
# 改路由必须两份同改，否则内网验证通过、公网 404。

# 安全响应头单点定义：nginx 的 add_header 只有「本层没有 add_header」时才继承父级，
# 所以每个自带 add_header（如 Cache-Control）的 location 都必须 include 本文件，
# 否则那些 location 会静默丢掉全部安全头。
include /etc/nginx/conf.d/security-headers.conf;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # certbot webroot：续期时把验证文件写进共享卷，nginx 直接静态返回（不占 443、不用停服）。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # 其余一律跳 https（301 会被浏览器缓存，域名定下来再上线；换域名先清缓存或用 308）。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 起步（1.3 优先）；关闭会话票据，减少长期密钥暴露面。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # 与应用侧 MAX_UPLOAD_MB=10 的关系见 nginx.conf 同名注释：必须严格大于应用上限。
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json text/css application/javascript text/plain image/svg+xml;

    # 公网入口把接口文档钉成 404（r97 验收口径）。
    # 后端生产档确实没挂载 /docs /redoc /openapi.json，但直连后端测 404 是**假绿**：
    # 经公网访问时，下面的 SPA fallback 会把未知路径回落到 index.html 并返回 200。
    # 必须在 nginx 层精确匹配拦掉，否则运维按手册 curl 会拿到 200 且内容还是首页。
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # r99：SPA fallback 会让 /.env、/.git/config、/backup.sql、/admin、/metrics 等
    # 一律返回 200 + index.html（不是真泄露，但扫描器误报，且一旦 dist 里真混入
    # dotfile 就会被 try_files 原样吐出去）。443 侧不需要 ACME webroot（80 那段才有），
    # 所以这里把所有点文件与常见备份/凭据后缀钉成 404。
    # 正则 location 优先于普通前缀，但不会命中 /assets/index-<hash>.js，长缓存不受影响。
    location ~ ^/\. { return 404; }
    location ~* \.(?:sql|dump|bak|old|env|pem|key|log|conf|ini)$ { return 404; }

    # SPA fallback。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：长缓存 + immutable（本层有自己的 add_header，故再 include 一次）。
    # 不用 `expires 1y`：它会自己生成一条 Cache-Control，再叠加下面的 add_header
    # 会产出**两个同名头**（max-age=31536000 / public, immutable），语义靠浏览器合并兜着。
    # 这里用单条 Cache-Control 把 max-age 与 immutable 一次写全。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # 后端 API：与 nginx.conf 的 proxy 参数逐字一致（含 1300s 长超时，本地模型链路需要）。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 收窄指纹：不把 uvicorn 的 Server 头透给公网。
        proxy_hide_header Server;

        add_header Cache-Control "no-store";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store";
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
