# 全站安全响应头（r97）：被 nginx.prod.conf 的 http / server / 各 location 分别 include。
#
# 为什么不是「只在 server 层写一遍」：nginx 的 `add_header` 采用「本层一旦有 add_header，
# 就不再继承父级」的语义。`/assets/`、`/api/`、`/health`、`/index.html` 各自都有 Cache-Control，
# 不显式 include 就会静默丢掉全部安全头——这类丢失在浏览器里完全看不出来，只能靠本文件兜住。
#
# 取舍：
# - HSTS 先不写 preload：preload 是不可逆承诺（要提交到浏览器预置列表），域名换过一版再谈；
# - CSP 用 'self' + style 'unsafe-inline'（React 的 style={{}} 走内联样式属性，去掉会白屏），
#   脚本没有内联（index.html 只有外链 module），所以 script-src 保持严格 'self'；
# - 不用 X-XSS-Protection：现代浏览器已移除该过滤器，保留反而可能引入旧漏洞。

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
