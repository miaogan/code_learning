version: 2
updates:
  # 所有依赖 PR 都打到 dev（受保护主干 master 只接受从 dev 走人工评审的合并）。
  # 仍会按需创建临时 dependabot/* 分支与 PR；清理远端分支不等于禁用依赖更新。
  # 后端运行时 + 测试依赖（requirements.txt 未钉版本，靠这条每周收安全更新）
  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # 大版本（含 0.x 的破坏性跨越，如 fastapi 0.110→0.162）一律人工升级：
    # 这类改动要走契约双侧同步 + 全量测试，不适合让 bot 合并。
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps(pip)

  # 前端依赖（React / Vite / vitest 等）
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # react 19 / eslint 10 / globals 17 这类大版本会打断 CI 与类型，留给人工升级。
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps(npm)

  # CI 里的 actions/checkout、setup-node、setup-python 等
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(actions)
