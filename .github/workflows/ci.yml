name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Retrieval eval gate
        run: node ../scripts/eval_retrieval.mjs --check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check app tests
      - name: Question bank byte gate
        run: python -X utf8 -m app.services.assessment.question_merge --check
      - name: Test
        run: python -m pytest -q
      - name: Offline eval gate
        run: python -X utf8 ../scripts/eval_harness.py --check
      - name: Question retrieval eval gate
        run: python -X utf8 ../scripts/eval_question_retrieval.py --check
      - name: Reliability fault-injection gate
        run: python -X utf8 ../scripts/eval_reliability.py --check
      - name: Live eval dry-run gate
        run: python -X utf8 ../scripts/eval_live.py --check
