name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # 只扫生产依赖：devDependencies（vite / vitest / eslint）不进构建产物，
      # 且其漏洞不随镜像分发。阈值取 high，moderate 由 Dependabot 跟进。
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Retrieval eval gate
        run: node ../scripts/eval_retrieval.mjs --check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # r98 起数据层只有 PostgreSQL（无 SQLite 兜底），测试与部分评测脚本都连真库，
    # 所以 CI 必须自带实例。端口映射到 5433 / 6380 与 `backend/.env.example`、
    # conftest 的默认 DSN 一致；下面的 env 再显式写一遍，不依赖「端口恰好相同」。
    # services 的健康检查由 Actions 自动等待，healthcheck 不通过则 job 直接失败。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # 测试基座会按这个 DSN 自动建库（sc_test / _empty / _legacy / _seed）。
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/sc_test
      EVAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/sc_eval
      # `test_r98_redis.py` 连真实实例验证共享窗口 / 缓存 / 锁；连不上会 skip，
      # 这里给上地址是为了让这几个用例在 CI 里真的跑起来。
      REDIS_TEST_URL: redis://127.0.0.1:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与 backend/Dockerfile 的 python:3.13-slim 对齐：CI 与生产同版，
          # 避免「CI 3.11 绿、容器 3.13 才暴露依赖差异」。本机 3.13.14 全量 910 用例已验。
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      # requirements.txt 用 >= 不钉版本，漏洞会随上游新版本漂移；
      # 门禁只在「已发布的已知漏洞」上红，不查传递依赖的许可问题。
      - name: Dependency audit
        run: |
          pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt --progress-spinner off
      - name: Lint
        run: python -m ruff check app tests
      - name: Question bank byte gate
        run: python -X utf8 -m app.services.assessment.question_merge --check
      - name: Test
        run: python -m pytest -q
      - name: Offline eval gate
        run: python -X utf8 ../scripts/eval_harness.py --check
      - name: Question retrieval eval gate
        run: python -X utf8 ../scripts/eval_question_retrieval.py --check
      - name: Reliability fault-injection gate
        run: python -X utf8 ../scripts/eval_reliability.py --check
      - name: Live eval dry-run gate
        run: python -X utf8 ../scripts/eval_live.py --check

  # CD：只有两个门禁 job 全绿、且是部署分支的 push 才触发。
  # 走「受限 deploy key + 固定 known_hosts」：服务器 authorized_keys 用
  # `restrict,command=` 把该 key 钉死到 scripts/deploy-from-ci.sh，客户端命令
  # 只是传递一个 commit SHA，脚本会自行校验 SHA 属于本分支最近 50 次提交。
  # 服务器侧再做「先 build 后一次性 up + 健康检查 + 失败回滚上一 SHA」。
  deploy:
    name: Deploy to public IP server
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/dev-skill-coach'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # 代码可以先合、Secrets 后配：没配齐就明确跳过，别让门禁全绿的 CI 变红。
          if [ -z "${DEPLOY_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ]; then
            echo "CD secrets 未配置，跳过部署（补齐 DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER 后自动生效）"
            exit 0
          fi
          SSH_DIR="$RUNNER_TEMP/sc-deploy-ssh"
          install -m 700 -d "$SSH_DIR"
          printf '%s\n' "$DEPLOY_KEY" > "$SSH_DIR/id_ed25519"
          chmod 600 "$SSH_DIR/id_ed25519"
          # 固定主机公钥，防止 CI 出口被中间人劫持时静默连到假服务器。
          # 该值来自服务器 /etc/ssh/ssh_host_ed25519_key.pub（公钥，不是秘密）。
          printf '%s\n' '43.166.23.144 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKaDcdnFN2BvUbi0wY4H+S6A/MS+SrGrlxZR5JE0eBjg' \
            > "$SSH_DIR/known_hosts"
          ssh -T \
            -i "$SSH_DIR/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o ConnectTimeout=25 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy ${GITHUB_SHA}"
          rm -f "$SSH_DIR/id_ed25519"
